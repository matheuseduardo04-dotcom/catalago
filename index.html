<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arte em Tecido | Catálogo de Artesanato</title>
    <meta
      name="description"
      content="Peças exclusivas Arte em Tecido: toalhas bordadas ou adesivadas e cadernos forrados feitos à mão."
    />
    <meta property="og:title" content="Arte em Tecido | Catálogo de Artesanato" />
    <meta
      property="og:description"
      content="Toalhas bordadas e cadernos forrados feitos à mão. Peças exclusivas."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #b04a5a;
        --secondary: #c9a876;
        --background: #f3e1d3;
        --accent: #8c3a47;
        --foreground: #4a3b35;
        --card: #fdf6ef;
        --border: #e3cdbb;
        --muted: #7a675c;
        --radius: 18px;
        --shadow: 0 10px 30px -12px rgba(140, 58, 71, 0.28);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Montserrat", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      img {
        display: block;
        max-width: 100%;
      }

      .wrap {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 20px;
      }

      header {
        text-align: center;
        padding: 40px 20px 24px;
      }

      header .logo {
        width: 150px;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
      }

      header p {
        margin-top: 8px;
        font-size: 0.9rem;
        color: var(--muted);
      }




      main {
        padding: 32px 0 8px;
      }

      h1 {
        font-family: "Caveat", cursive;
        font-size: 2.4rem;
        color: var(--primary);
        text-align: center;
        font-weight: 700;
        line-height: 1.1;
      }

      .kicker {
        text-align: center;
        margin-top: 6px;
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--secondary);
      }

      .grid {
        margin-top: 28px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 40px -14px rgba(140, 58, 71, 0.35);
      }

      .card img {
        width: 100%;
        height: 210px;
        object-fit: cover;
      }

      .card-body {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }

      .card h2 {
        font-size: 1rem;
        color: var(--accent);
        line-height: 1.35;
      }

      .card p {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .row {
        margin-top: auto;
        padding-top: 8px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
      }

      .price {
        font-family: "Caveat", cursive;
        font-size: 1.9rem;
        color: var(--primary);
        font-weight: 700;
      }

      .btn {
        flex-shrink: 0;
        display: inline-block;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: background 0.2s ease;
      }

      .btn:hover {
        background: var(--accent);
      }

      .cta {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        text-align: center;
        padding: 26px 20px;
        margin: 36px 0;
      }

      .cta h2 {
        font-family: "Caveat", cursive;
        font-size: 1.9rem;
        color: var(--primary);
      }

      .cta p {
        margin: 8px auto 0;
        max-width: 420px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .cta .btn {
        margin-top: 18px;
        background: var(--accent);
        padding: 13px 24px;
        font-size: 0.8rem;
      }

      footer {
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
        padding: 0 20px 40px;
      }

      footer .stitch {
        display: none;
      }

      @media (min-width: 640px) {
        header .logo {
          width: 180px;
          height: auto;
        }
        h1 {
          font-size: 3rem;
        }
        .grid {
          grid-template-columns: 1fr 1fr;
        }
        .card h2 {
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img
        class="logo"
        src="assets/arte-em-tecido-logo.png"
        alt="Arte em Tecido Artesanato"
      />
      <p>Peças exclusivas feitas à mão, com carinho em cada ponto.</p>
    </header>


    <main class="wrap">
      <h1>Catálogo de peças</h1>
      <p class="kicker">Arte em Tecido</p>
      <section class="grid" id="grid"></section>

      <section class="cta">
        <h2>Personalize sua peça</h2>
        <p>
          Escolha o tecido, a cor da linha e o bordado. Também fazemos encomendas especiais para
          presentes e datas comemorativas.
        </p>
        <a class="btn" id="cta-link" target="_blank" rel="noreferrer">Falar no WhatsApp</a>
      </section>
    </main>

    <footer>
      Arte em Tecido · Artesanato feito à mão
    </footer>

    <script>
      const produtos = [
        {
          nome: "Toalha bordada ou adesivada para banho",
          preco: "R$ 120,00",
          descricao: "Toalha de banho felpuda com bordado ou aplique personalizado.",
          imagem:
            "https://images.unsplash.com/photo-1600369672770-985fd30004eb?auto=format&fit=crop&w=900&q=80",
        },
        {
          nome: "Toalha bordada ou adesivada para lavabo",
          preco: "R$ 60,00",
          descricao: "Toalhinha pequena de lavabo, acabamento delicado feito à mão.",
          imagem:
            "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=900&q=80",
        },
        {
          nome: "Caderno pequeno forrado",
          preco: "R$ 60,00",
          descricao: "Caderno pequeno com capa forrada em tecido à sua escolha.",
          imagem:
            "https://images.unsplash.com/photo-1531346878377-a5be20888e57?auto=format&fit=crop&w=900&q=80",
        },
        {
          nome: "Caderno grande forrado",
          preco: "R$ 90,00",
          descricao: "Caderno grande com capa forrada, resistente e personalizado.",
          imagem:
            "https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=900&q=80",
        },
      ];

      const whatsapp = (texto) =>
        "https://wa.me/5511999169967?text=" + encodeURIComponent("Olá! Tenho interesse em: " + texto);

      const grid = document.getElementById("grid");
      produtos.forEach((p) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML =
          '<img loading="lazy" src="' +
          p.imagem +
          '" alt="' +
          p.nome +
          '" />' +
          '<div class="card-body">' +
          "<h2>" +
          p.nome +
          "</h2>" +
          "<p>" +
          p.descricao +
          "</p>" +
          '<div class="row"><span class="price">' +
          p.preco +
          '</span><a class="btn" target="_blank" rel="noreferrer" href="' +
          whatsapp(p.nome) +
          '">Encomendar</a></div>' +
          "</div>";
        grid.appendChild(card);
      });

      document.getElementById("cta-link").href = whatsapp("uma peça personalizada");
    </script>
  </body>
</html>
